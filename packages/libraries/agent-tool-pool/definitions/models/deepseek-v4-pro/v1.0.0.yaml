# DeepSeek V4 Pro (0813 release). There is no V4.1 Pro as of the verification date.
schemaVersion: v0
kind: MODEL
id: deepseek-v4-pro
version: v1.0.0
digest: 4cc6803244742576bd9c8758e6b385dc0ce5436f6e1ef47f025ccf357bd54f53
description: DeepSeek V4 Pro via the OpenAI-compatible API; the stronger model for evaluation baselines.
provider: deepseek
apiModelId: deepseek-v4-pro
providerModelLabel: DeepSeek-V4-Pro-0813
apiProtocol: OPENAI_CHAT_COMPLETIONS
baseUrl: https://api.deepseek.com
limits:
  # The pricing page lists "1M" context and "384K" max output.
  contextWindowTokens: 1000000
  maxOutputTokens: 384000
features:
  hasJsonOutput: true
  hasToolCalls: true
  hasVision: false
  thinking:
    isSupported: true
    isEnabledByDefault: true
    effortLevels: [low, high, max]
pricing:
  currency: USD
  # Integers: micro-USD per 1M tokens, i.e. 22000 = 0.022 USD per 1M tokens.
  unit: MICRO_USD_PER_MILLION_TOKENS
  offPeak:
    inputCacheHit: 22000
    inputCacheMiss: 660000
    output: 1980000
  # DeepSeek also bills Chinese public holidays at off-peak rates. M1 has no holiday
  # calendar, so costs computed from this rule are upper bounds on those days.
  peak:
    ratePercent: 200
    timeZone: UTC
    weekdays: [1, 2, 3, 4, 5]
    windows:
      - { start: '01:00', end: '04:00' }
      - { start: '06:00', end: '10:00' }
  source:
    url: https://api-docs.deepseek.com/quick_start/pricing
    verifiedOn: '2026-09-28'
