# Values of features.thinking were measured in stage 0 (M2TechStack 3.2).
schemaVersion: v1
kind: MODEL
id: deepseek-flash
version: v0.1.0
description: DeepSeek V4.1 Flash via the OpenAI-compatible API; the default low-cost model for M1.
provider: deepseek
apiModelId: deepseek-flash
providerModelLabel: DeepSeek-V4.1-Flash
apiProtocol: OPENAI_CHAT_COMPLETIONS
baseUrl: https://api.deepseek.com
limits:
  contextWindowTokens: 1000000
  maxOutputTokens: 384000
features:
  hasJsonOutput: true
  hasToolCalls: true
  hasVision: true
  thinking:
    isSupported: true
    effortMapping:
      - effort: none
        request:
          thinking: DISABLED
      - effort: low
        request:
          thinking: ENABLED
          providerEffort: low
      - effort: high
        request:
          thinking: ENABLED
          providerEffort: high
      - effort: max
        request:
          thinking: ENABLED
          providerEffort: max
    replayReasoning: REQUIRED
    missingReasoningFill: EMPTY_STRING
    reasoningCountsAsOutput: true
pricing:
  currency: USD
  unit: MICRO_USD_PER_MILLION_TOKENS
  offPeak:
    inputCacheHit: 3000
    inputCacheMiss: 150000
    output: 600000
  peak:
    ratePercent: 200
    timeZone: UTC
    weekdays:
      - 1
      - 2
      - 3
      - 4
      - 5
    windows:
      - start: 01:00
        end: 04:00
      - start: 06:00
        end: '10:00'
  source:
    url: https://api-docs.deepseek.com/quick_start/pricing
    verifiedOn: '2026-09-28'
