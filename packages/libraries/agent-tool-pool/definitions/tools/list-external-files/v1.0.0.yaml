modelDescription: >-
  List a folder OUTSIDE the repository as a tree. path is absolute, exactly as the user or a
  file you read gave it: /home/alice/app or D:\work\app (or D:/work/app); no relative paths, no ~,
  no other form, never a guessed path. depth 1 to 3 (default 2); glob filters. A missing path and a
  forbidden one give the same error.
