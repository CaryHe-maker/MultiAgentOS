schemaVersion: v1
kind: TOOL
id: run-subagents
version: v0.1.0
description: Control tool that starts SubAgent tasks and returns their joined results.
purpose: CONTROL
modelName: run_subagents
modelDescription: >-
  Start up to 8 subtasks that run in parallel, and get all their results back when every one has
  finished. Each task has a unique name, an agent (explorer reads and reports, worker changes
  files), a goal that stands on its own (the agent does not see your conversation), and optional
  dependsOn (names of other tasks of this call; a task starts after them and receives their
  results), acceptance (what its result must show), inputs (artifacts you hand over), effort and
  budget (a token share). An explorer thinks at none or low, a worker at low, high or max; an
  effort the agent does not allow is set to the nearest one it does, and the task still runs. Each result you get back is the summary of the task and, when it is short enough (1000 lines, 60000 characters), its report; a longer report, and the tool results the task handed over, are read with read_output by the reference ref_N/toolCallId shown with the result. A worker must have writeScope: the repository paths it may change, which must lie
  within what you may write and must not overlap the scope of a worker that can run at the same
  time. An explorer has no writeScope. While the tasks run you cannot write or run commands.
  Call it on its own.
parametersContract:
  kind: contract
  id: workflow.RunSubagentsArgs
  version: v1
riskClass: MEDIUM
sideEffect: WORKSPACE_WRITE
isIdempotent: false
contentStatus: FINAL
