schemaVersion: v1
kind: TOOL
id: run-subagents
version: v0.1.0
description: Control tool that starts SubAgent tasks that run while the caller goes on.
purpose: CONTROL
modelName: run_subagents
modelDescription: >-
  Start up to 8 subtasks that run in parallel. The call returns at once; the tasks run while you
  go on, and their results come to you as they finish. To wait for them, call sleep with until
  children: you are woken as each one ends, so you can use its result while the others work. A
  task that must wait for another belongs in dependsOn rather than started at once. plan is the
  plan of the whole work (what is delivered and how it is checked, the approach, the split, who
  owns which part and which shared file or interface, the constraints): the root task of a long
  task must give it with its first call, and every task below sees it, so goals need not repeat
  it; a later plan replaces it. You cannot finish (reply or finish) while a task you started
  still runs. Each task has a unique name, an agent (explorer reads and reports, worker changes
  files, lead runs a part of the work and may start its own subtasks), a goal that stands on its
  own (the agent does not see your conversation), and optional dependsOn (names of other tasks of
  this call; a task starts after them and receives their results), acceptance (what its result
  must show), inputs (artifacts you hand over), effort and budget (a token share). An explorer
  thinks at none or low, a worker or lead at low, high or max; an effort the agent does not allow
  is set to the nearest one it does, and the task still runs. Each result you get back is the
  summary of the task and, when it is short enough (1000 lines, 60000 characters), its report; a
  longer report, and the tool results the task handed over, are read with read_output by the
  reference ref_N/toolCallId shown with the result. A worker or lead must have writeScope: the
  repository paths it may change, which must lie within what you may write and must not overlap
  the scope of another task that can run at the same time. An explorer has no writeScope. The
  scope you give a task is lent to it: until it ends only it writes there, you write elsewhere,
  and your commands see it read-only. commands false lends the scope without commands. role is
  one line of what the task is responsible for (frontend, backend storage), which every task of
  the work sees. continues gives work back to a task of yours that has ended: name it, use the
  same agent, and the new task goes on from all of that task's history (the code it read, what it
  tried) with your goal as what it is asked now; it costs far less than a new task that reads
  everything again, so send a defect in a finished part back to its owner this way rather than
  fixing it yourself. Tasks talk to each other with send_message. A task whose goal is to make a
  failing check pass, review a change, write tests from a specification, start the whole system
  and fix what fails, or research outside the repository belongs to sub_mission (when you have
  it), where a template carries the method. Call it on its own.
parametersContract:
  kind: contract
  id: workflow.RunSubagentsArgs
  version: v1
riskClass: MEDIUM
sideEffect: WORKSPACE_WRITE
