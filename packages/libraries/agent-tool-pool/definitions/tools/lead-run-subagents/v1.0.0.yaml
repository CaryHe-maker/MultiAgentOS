description: Control tool of a lead that starts its own subtasks, explorers and workers only (D88, D93).
purpose: CONTROL
modelName: run_subagents
modelDescription: >-
  Start up to 8 subtasks that run in parallel. Returns at once; each result comes to you
  when its task ends (sleep with until children to wait). Each task has a unique name, an agent
  (explorer or worker), a goal, a writeScope, and optionally role (one line every task sees), dependsOn (names of
  tasks of this call it waits for and whose results it gets), inputs (artifacts you hand over),
  effort and budget. A task finishes when its goal is done, so the goal says what done means. writeScope
  is required in every task: for a worker the repository paths it may change, inside what you may
  write and not overlapping a task that can run at the same time (until it ends only it writes there
  and your commands see it read-only); for an explorer []. A task starts with your context, so its
  goal says only what its part is. continues starts a task from the history of an ended task of
  yours (same agent): use it to send a defect back to its owner. A task that breaks a rule is not
  started and you are told why; the others start. A result shows the summary, the report when
  short, and the checks the task ran; read a long report or a handed-over result with read_output
  by its ref_N/toolCallId. You cannot finish while a task you started runs.
