schemaVersion: v1
kind: TOOL
id: update-todos
version: v0.1.0
description: Control tool that replaces the todo list of an AgentRun; it ends nothing.
purpose: CONTROL
modelName: update_todos
modelDescription: >-
  Keep a todo list for a longer task, so no step is forgotten. Each call replaces the whole list:
  todos is an array of at most 30 items, and each item has exactly two fields, content (text of at
  most 200 characters) and status (pending, in_progress, completed or cancelled); several items may be
  in_progress at once. No other field (no id, no priority) is accepted. It may come with other tool calls in the same reply.
parametersContract:
  kind: contract
  id: workflow.UpdateTodosArgs
  version: v1
riskClass: READ_ONLY
sideEffect: NONE
isIdempotent: true
contentStatus: FINAL
