schemaVersion: v1
kind: TOOL
id: read-external-file
version: v0.1.0
description: Model-facing read of a file outside the repository, served by the external-read unit.
purpose: UNIT
modelName: read_external_file
modelDescription: >-
  Read up to 400 lines of a text file OUTSIDE the repository, with line numbers. path is
  absolute, exactly as the user or a file you read gave it: /home/alice/app/main.ts or
  D:\work\app\main.ts (or D:/work/app/main.ts); no relative paths, no ~, no other form, never a
  guessed path. startLine and endLine are optional, 1-based, inclusive. Read only.
parametersContract:
  kind: contract
  id: executor.FileReadInput
  version: v1
riskClass: READ_ONLY
sideEffect: NONE
isIdempotent: true
contentStatus: FINAL
