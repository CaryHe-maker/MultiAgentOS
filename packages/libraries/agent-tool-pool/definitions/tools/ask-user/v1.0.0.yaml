description: Control tool that asks the user a question and returns the answer.
purpose: CONTROL
modelName: ask_user
modelDescription: >-
  Ask the user and wait for the answer. kind ask is a question (optionally with fields: text,
  textarea, select, multiselect or confirm, each with a name and a label), confirm asks yes or no
  before something that cannot be undone, review shows an artifact (reviewArtifact) for comment. Ask
  only what you cannot find out or decide yourself. An answer is not a permission. Call it alone.
