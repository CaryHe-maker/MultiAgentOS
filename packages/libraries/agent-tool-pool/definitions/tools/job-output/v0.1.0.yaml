schemaVersion: v1
kind: TOOL
id: job-output
version: v0.1.0
description: Control tool that reads what a background command of the task printed.
purpose: CONTROL
modelName: job_output
modelDescription: >-
  Read what one of your background commands printed since you last read it (job_1, or
  fix-api/job_1 for one a subtask that ended left running), up to 32 KB, with its state at the end.
  fromStart reads from the oldest output kept. It does not wait: sleep with jobs to wait.
parametersContract:
  kind: contract
  id: workflow.JobOutputArgs
  version: v1
riskClass: LOW
sideEffect: NONE
isIdempotent: false
contentStatus: FINAL
