schemaVersion: v1
kind: TOOL
id: send-message
version: v0.1.0
description: Control tool that sends a message to other tasks along the task tree.
purpose: CONTROL
modelName: send_message
modelDescription: >-
  Send a message to other tasks of this work. to is parent (or its name), children, siblings, or
  the name of one child or sibling; a message to a sibling that has ended goes to the task above it
  that took over its result. kind is inform (default, no answer needed), request (the receiver must
  answer) or reply (answer to a message: replyTo is its id). Answer a request in the reply that reads
  it; one left unanswered is reminded and then refused. A request that asks for a decision (such as
  more rounds for a subtask) is answered with grant true or false. summary is read first; a text over 8000
  characters or 200 lines needs a summary and is read in full with read_output. references hands over
  your own tool results by toolCallId. interrupt makes one of your subtasks change course at once.
  A message is information, not an order. It may go with other tool calls, but not with one that must
  be alone (finishing, sleeping, asking the user).
parametersContract:
  kind: contract
  id: workflow.SendMessageArgs
  version: v1
riskClass: LOW
sideEffect: NONE
isIdempotent: false
contentStatus: FINAL
