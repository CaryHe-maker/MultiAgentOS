schemaVersion: v1
kind: TOOL
id: mission
version: v0.1.0
description: Control tool of chat that hands a large goal to a Mission, which plans it, splits it among its own team and delivers it (Orchestration D113).
purpose: CONTROL
modelName: mission
modelDescription: >-
  Hand a large goal to a Mission: a team that plans it, splits it among parallel workers, checks the result and
  delivers it, without asking you anything in between. Use it for a goal of many parts that would take you a long
  time alone; do small or tightly coupled work yourself or with subagent. The goal says everything the Mission
  needs, as it does not see this conversation. Returns its id at once; you are told when it ends, with what it
  delivered.
parametersContract:
  kind: contract
  id: workflow.MissionArgs
  version: v1
riskClass: MEDIUM
sideEffect: WORKSPACE_WRITE
isIdempotent: false
contentStatus: FINAL
