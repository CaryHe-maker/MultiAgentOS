schemaVersion: v1
kind: TOOL
id: finish-explorer
version: v0.1.0
description: Control tool that ends an explorer with its findings.
purpose: CONTROL
modelName: finish_subagent
modelDescription: >-
  Return your result to the agent that started you, and stop; call it alone. The whole call must stay under 8000 characters: what is longer is cut, so put the answer first and keep only findings that matter. summary answers the
  goal. findings has one entry per claim, each with the evidence that supports it (the toolCallId of a
  result of yours, the address of a page, or path:first-last for lines of a file). openQuestions lists what you could not settle. When the task had
  acceptance criteria, acceptance answers each by its index (starting at 0) with met, not_met or
  unknown.
parametersContract:
  kind: contract
  id: workflow.ExplorerResult
  version: v1
riskClass: READ_ONLY
sideEffect: NONE
isIdempotent: true
contentStatus: FINAL
