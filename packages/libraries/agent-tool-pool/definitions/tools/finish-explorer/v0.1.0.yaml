schemaVersion: v1
kind: TOOL
id: finish-explorer
version: v0.1.0
description: Control tool that ends an explorer with its summary and report.
purpose: CONTROL
modelName: finish_subagent
modelDescription: >-
  Return your result to the agent that started you, and stop; call it alone. summary is the answer to
  the goal in at most 2000 characters, and comes first: it is what the reader always sees. report
  is everything you found, in full, with the evidence written into the text (file:first-last,
  the address of a page, the toolCallId of a result of yours); it has no length limit, and the
  reader is shown it whole when it is at most 1000 lines and 60000 characters, otherwise only the
  summary and the id to read it by. references is optional: the toolCallIds of your own tool
  calls whose results the caller should be able to read later (a page you fetched, a long output);
  list only those worth it, the system keeps the ones that were successful calls of yours and
  tells the caller about any that were not, and the result is accepted either way. openQuestions lists what you could not settle. When the task
  had acceptance criteria, acceptance answers each by its index (starting at 0) with met,
  not_met or unknown.
parametersContract:
  kind: contract
  id: workflow.ExplorerResult
  version: v1
riskClass: READ_ONLY
sideEffect: NONE
isIdempotent: true
contentStatus: FINAL
