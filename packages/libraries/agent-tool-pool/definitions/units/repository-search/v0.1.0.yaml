schemaVersion: v1
kind: UNIT
id: repository-search
version: v0.1.0
description: Search the repository snapshot and build a SEARCH ContextPack.
executionKind: REPOSITORY_SEARCH
protectedCapabilities:
  - repo.read
inputContract:
  kind: contract
  id: context.RepositorySearchInput
  version: v1
outputContract:
  kind: contract
  id: context.RepositorySearchOutput
  version: v1
toolRefs:
  - id: search-repository
    version: v0.1.0
effect: READ_ONLY
isIdempotent: true
failurePolicy:
  OUT_OF_SCOPE: RETURN_TO_MODEL
  INVALID_QUERY: RETURN_TO_MODEL
  LIMIT_EXCEEDED: RETURN_TO_MODEL
  UNIT_TIMEOUT: RETURN_TO_MODEL
