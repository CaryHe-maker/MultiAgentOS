schemaVersion: v1
kind: UNIT
id: external-search
version: v0.1.0
description: Search a folder outside the repository, through the same file set as the repository tools.
executionKind: REPOSITORY_SEARCH
protectedCapabilities:
  - external.read
inputContract:
  kind: contract
  id: context.RepositorySearchInput
  version: v1
outputContract:
  kind: contract
  id: context.RepositorySearchOutput
  version: v1
toolRefs:
  - id: search-external-repository
    version: v0.1.0
effect: READ_ONLY
isIdempotent: true
failurePolicy:
  EXTERNAL_PATH_UNAVAILABLE: RETURN_TO_MODEL
  OUT_OF_SCOPE: RETURN_TO_MODEL
  INVALID_QUERY: RETURN_TO_MODEL
  LIMIT_EXCEEDED: RETURN_TO_MODEL
  UNIT_TIMEOUT: RETURN_TO_MODEL
