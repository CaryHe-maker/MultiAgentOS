schemaVersion: v1
kind: TEMPLATE
id: explore-build
version: v0.1.0
description: 'Pre-orchestrated: explore first, then decide the approach and build it.'
origin: BUILTIN
nodes:
  - name: root
    kind: AGENT
    agent:
      id: lead
      version: v0.1.0
    output: true
playbook:
  summary: explore what is unclear first, then decide the approach and build it
  params:
    - name: questions
      description: what must be found out before building (one per line)
      required: true
  phases:
    - name: explore
      tasks:
        agent: explorer
        min: 1
        max: 3
      instructions: >-
        Split the questions among 1 to 3 explorers, one area each, so their reading does not
        overlap. Each goal asks for facts with the files and lines they come from, not opinions.
        Sleep until they have all ended.
    - name: decide
      instructions: >-
        From what they found, decide the approach yourself and write it down in a file in your
        scope when others must follow it (interfaces, names). If a question is still open, say
        so in the goals of the builders rather than guessing.
    - name: build
      tasks:
        agent: worker
        min: 1
        max: 4
        context: inherit
      instructions: >-
        Start 1 to 4 workers with writeScopes that do not overlap, each with the part of the
        approach it builds and acceptance criteria with a check. Sleep until they have all ended.
    - name: verify
      instructions: >-
        Read what changed, run the checks of the whole part yourself, and fix small things; then
        finish with what was found, the approach, what was built and how it was checked.
  example: |-
    Example 1. Brief (from the root of a small language toolchain): goal "add string
    interpolation: in "total: {n + 1}" the expression inside the braces is evaluated";
    questions "how does the lexer read a string literal today? which node of lang/ast.py holds
    a string? how does the compiler emit joining two strings, and what turns a value into
    text?"; writeScope ["lang/lexer/", "lang/parser/", "lang/compiler/", "lang/ast.py"].
    explore: run_subagents with two explorers: "front-look" (how lang/lexer reads strings and
    escapes, and what lang/parser builds from them) and "back-look" (how lang/compiler emits
    strings and joins them, and what the VM offers to turn a value into text). Slept until
    both ended: the lexer returns one STRING token with escapes resolved; the parser makes a
    Str node; the compiler has CONCAT; the VM has TO_TEXT, used by print only.
    decide: the lexer splits such a string into STRING parts and the tokens between the
    braces; the parser builds a new node Interp(parts); the compiler emits each part, TO_TEXT
    after an expression, then CONCAT. I added Interp to lang/ast.py myself, because both
    builders depend on it.
    build: two workers: "interp-front" writeScope ["lang/lexer/", "lang/parser/"] (the split
    and the Interp node; a brace that is never closed is error E11; unit tests) and
    "interp-back" writeScope ["lang/compiler/"] (emit Interp as decided; unit tests).
    verify: I read both changes against lang/ast.py, ran the unit tests and the conformance
    tests (all passed), and fixed the escape "{{" myself; finish_subagent status done with
    what was found, the node, what was built and the checks.

    Example 2. Brief: goal "add a --since flag to the export command"; questions "where does
    export read its rows? is there already a date filter anywhere?"; writeScope ["cli/",
    "tests/"].
    explore: one explorer is enough for two small questions. It found that export reads rows
    through store.rows() and that the report command already filters with
    store.rows(since=...).
    decide: reuse store.rows(since=...); no interface file is needed for one builder.
    build: one worker "export-since" with that approach and the check "pytest tests/test_cli.py
    -q". verify: I ran the tests and the command by hand; finish with the reuse found and the
    change.

    Example 3. Brief: goal "let the mobile app work offline: reads from a local cache, writes
    queued until the network is back"; questions "how does the app fetch data today? where is
    state kept? how are writes sent?"; writeScope ["app/src/"].
    explore: three explorers, one per question, so their reading does not overlap. They found
    one fetch wrapper (app/src/net/api.ts), state in a store per screen, and writes sent from
    the screens directly.
    decide: all reads and writes go through api.ts; it reads from a local cache first and
    queues writes; wrote app/src/net/OFFLINE.md with the cache keys and the queue format.
    build: two workers, "cache" (api.ts reads, the cache) and "queue" (writes, the queue,
    moving the screens' writes to api.ts), with OFFLINE.md as their interface.
    verify: ran the tests and the offline scenario of OFFLINE.md; finish with the design and
    what was checked.
