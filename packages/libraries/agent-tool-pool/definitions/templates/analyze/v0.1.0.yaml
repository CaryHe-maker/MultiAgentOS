schemaVersion: v1
kind: TEMPLATE
id: analyze
version: v0.1.0
description:
  'Answer a question about the repository: the planner hands it to the code viewer or answers
  itself.'
origin: BUILTIN
nodes:
  - name: plan
    kind: AGENT
    agent:
      id: planner
      version: v0.1.0
    output: true
  - name: view
    kind: AGENT
    agent:
      id: code-viewer
      version: v0.1.0
    dependsOn:
      - node: plan
        when:
          field: action
          equals: HANDOFF
    inputFrom: HANDOFF
    output: true
