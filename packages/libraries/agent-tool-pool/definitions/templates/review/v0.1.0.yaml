schemaVersion: v1
kind: TEMPLATE
id: review
version: v0.1.0
description: 'Pre-orchestrated: an independent, read-only review of changes against criteria.'
origin: BUILTIN
nodes:
  - name: root
    kind: AGENT
    agent:
      id: lead
      version: v0.1.0
    output: true
playbook:
  summary: an independent read-only review of changes against criteria
  params:
    - name: criteria
      description: what the review checks (one per line), for example correctness, tests, style
      required: true
  phases:
    - name: review
      tasks:
        agent: explorer
        min: 1
        max: 2
      instructions: >-
        Start 1 or 2 explorers that did not write the changes. Each goal names the files or the
        change to review and the criteria, and asks for each finding with its file, line, why it
        is wrong and how sure the reviewer is. Sleep until they have ended.
    - name: report
      instructions: >-
        Check the findings you doubt by reading the code yourself, drop the ones that do not hold,
        and finish with the findings by importance. You change no file.
  example: |-
    Brief (from the root of a flight booking system): goal "review services/gateway,
    services/accounts and how every service learns which user a request is for"; criteria
    "one user can never read or change another user's data; passwords are salted hashes;
    tokens expire and logout ends them; the services trust the user only when the gateway
    passed it on"; no writeScope.
    review: two explorers that wrote none of it: "auth-review" reads services/gateway and
    services/accounts against the criteria on passwords, tokens and logout; "trust-review"
    reads how flights, bookings and payments take the user of a request. Slept until both
    ended. auth-review found that logout does not end a cached token (gateway/cache.py line
    22, sure) and that passwords are salted (no finding). trust-review found that every
    service reads the X-User header from any caller (bookings/http.py line 14, and the same
    in flights and payments, sure), so anyone who can reach a service can act as any user.
    report: I read bookings/http.py line 14 and the gateway: nothing signs or checks the
    header, so the finding holds; the cached token holds too. finish_subagent status done with
    the two findings, the trust of X-User first because it lets anyone act as anyone.
