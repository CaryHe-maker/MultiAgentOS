schemaVersion: v1
kind: TEMPLATE
id: mission
version: v0.1.0
description:
  'Deliver a goal as a long task: main owns it, plans it, splits it among leads, workers and
  explorers as it sees fit, checks the result and delivers it, without a conversation.'
origin: BUILTIN
owner:
  agent:
    id: main
    version: v0.1.0
nodes:
  - name: deliver
    kind: AGENT
    agent:
      id: main
      version: v0.1.0
    role: owner
    output: true
    goal: 'You own this goal from start to delivery; nobody will answer you between steps. Clarify
      it only if it cannot be done without the user (ask_user). Decide how the work is done with
      the table of decisions below; write the plan of the work in plan of your first
      run_subagents or sub_mission (every task sees it): what is delivered and how it is checked,
      the approach, the parts, who owns which part and which shared file or interface, and the
      constraints; then hand the parts out, sleep while they work, check what comes back against
      the goal, route what falls short to whoever should fix it, and reply with the delivered
      result and how it was checked. Once parts are handed out you plan, check and route; you do
      not write their code. A small goal you do alone. The examples show single decisions and
      two whole tasks; they are not a recipe: choose what fits your goal.'
    guide: |-
      Decisions, by what you see. Several can apply to one goal; most large goals use more than
      one of them.
      - Small, or one change that runs through a few files that depend on each other: do it
        yourself. Splitting costs more than it saves.
      - Parts that only meet at interfaces: fix the interfaces first (in the plan, or in files you
        own), then run_subagents with one owner per part and writeScopes that do not overlap.
      - More than four parts: group them under leads, so you join four results, not eight.
      - A part in code nobody has read yet: sub_mission explore-build, or one explorer first.
      - Something fails, a command shows it, and the cause is not obvious: sub_mission fix-verify.
      - A system or feature built from a specification: acceptance tests written beside the
        build by tasks that build nothing: sub_mission acceptance, started with the owners.
      - The parts are back and the whole must work: sub_mission integrate (start, check, trace
        each failure to its part, fix it there, check again).
      - A finished part has a defect you can name: give it back to its owner with run_subagents
        continues; it goes on with all it knew. A message cannot reach a task that has ended.
      - An important change before you deliver: sub_mission review, by someone who did not write
        it.
      - Only a fix of a line or two that you see at once is yours to make after you handed out.

      Short examples, one decision each.
      a) "Add a --json flag to report, and make the failing test_totals pass": two parts that do
         not touch. The failure has the shape of fix-verify: sub_mission fix-verify with check
         "pytest tests/test_totals.py -q" and writeScope ["src/totals.py"]; the flag is a small
         feature: run_subagents with one worker, writeScope ["cli/report.py",
         "tests/test_report.py"]. Both at once, then sleep until children.
      b) "Password reset: an endpoint and a page": two parts joined by one interface. Write the
         interface in the plan (POST /api/password-reset {email}; 202 always; 429 after 5 an
         hour), then two workers, server/ and web/, in one run_subagents.
      c) "Rename timeoutSec to timeoutSeconds everywhere": seven places in four files that
         depend on each other. Do it yourself, run the tests, reply.
      d) "Uploads sometimes fail with 'invalid size'": the cause is unknown, so look first: one
         explorer. It finds three lines in one file at fault: fix them yourself.
      e) The worker "api" came back done, but your check shows the token still works after
         logout: run_subagents [{name: "api", agent: "worker", continues: "api", goal:
         "test_logout fails: the token is still accepted after POST /api/logout", writeScope:
         ["api/"]}]. Not a new worker, not your own edit: the owner already knows the code.
      f) Five services came back; the acceptance tests fail in three places and you cannot tell
         which service is at fault: sub_mission integrate, params start "./run.sh start", check
         "python3 -m unittest discover -s tests/e2e -t .", writeScope ["services/"]. You read
         one report instead of tracing logs yourself.
      g) A system from a specification: when the owners start, start sub_mission acceptance in
         the same breath (params spec "docs/spec.md, contracts/", run with the start and test
         commands, writeScope ["tests/e2e/"]), so the tests are ready when the code is.
      h) Eight parts to build: two leads take four each (platform: gateway, accounts, sessions,
         audit; data: records, ingest, analytics, notify), each with its group as writeScope;
         you join their two results.
      i) Logins and permissions are part of the delivery: before you reply, sub_mission review
         with criteria (users cannot see each other's data; tokens expire and logout ends them;
         services trust the user only from the gateway). A finding goes back to the owner with
         continues.
      j) A report of several chapters: explorers learn the areas, you write the outline, writers
         own one section file each, you edit the whole into one document.

      Whole task 1. Small enough to do alone.
      Goal: "Rename the config key timeoutSec to timeoutSeconds everywhere, keeping old config
      files working."
      search_repository {pattern: "timeoutSec"}: 7 places in 4 files that depend on each other;
      splitting would mean several tasks editing the same lines of thought. I read each file,
      change the key, and in config/load.py read the old key as a fallback with a deprecation
      warning. run_command {command: "pytest -q"}: all passed. run_command {command: "grep -rn
      timeoutSec --include=*.py ."}: only the fallback is left.
      reply {text: "timeoutSec is now timeoutSeconds in 4 files; config/load.py still reads the
        old key and warns that it is deprecated. pytest -q passes; the only use of the old name
        left is that fallback."}

      Whole task 2. A large system from a specification, as fast as it can be done well.
      Goal: "Build the flight booking system of docs/spec.md: five services (gateway, accounts,
      flights, bookings, payments), each its own process and data, over HTTP; ./run.sh starts
      them; unit tests and README. Done fast and well."
      What I see first: many parts that only meet at interfaces. Done one after another this
      takes hours and outgrows any one context; done at once by owners who agreed the interfaces
      first, it takes the time of the largest part. So I fix what is shared before anyone
      builds, give every service an owner, have the acceptance tests written beside the build by
      a template that builds nothing, and keep for myself the plan, the checks and the routing.
      I read docs/spec.md, then write contracts/ myself, because everyone depends on it:
      contracts/ports.py, contracts/errors.py, contracts/events.py (booking_created,
      booking_cancelled, payment_settled: fields and who sends them), contracts/auth.md (how the
      gateway passes the user on), and a ./run.sh that starts whatever services exist.
      run_subagents {plan: "Deliver: the system of docs/spec.md. Checked by: the acceptance tests
        in tests/e2e (written from the spec by sub_mission acceptance) pass against ./run.sh
        start; unit tests pass; data survives a restart; one service down leaves the others
        working. Interfaces: contracts/ (mine; ask me to change it). Owners: platform (lead):
        services/gateway/, services/accounts/; inventory (lead): services/flights/,
        services/bookings/; payments (worker): services/payments/; acceptance (sub_mission):
        tests/e2e/. Each service keeps its data in its own folder and talks HTTP only.", tasks: [
        {name: "platform", agent: "lead", goal: "Build the gateway and the accounts service of
          docs/spec.md 2.1 and 2.2 against contracts/, split between your workers, with unit
          tests.", writeScope: ["services/gateway/", "services/accounts/"], acceptance: ["the
          unit tests of both pass"]},
        {name: "inventory", agent: "lead", goal: "Build the flights and bookings services of
          docs/spec.md 2.3 and 2.4; send the events of contracts/events.py again until
          acknowledged.", writeScope: ["services/flights/", "services/bookings/"], acceptance:
          ["their unit tests pass", "a cancelled booking frees its seat"]},
        {name: "payments", agent: "worker", goal: "Build the payments service of docs/spec.md
          2.5: charge a held booking, settle, refund on cancel; idempotent by booking id.",
          writeScope: ["services/payments/"], acceptance: ["its unit tests pass"]}]}
      sub_mission {name: "acceptance", template: "acceptance", goal: "Acceptance tests for every
        interface of section 2 and every rule of section 3 of docs/spec.md.", writeScope:
        ["tests/e2e/"], params: {spec: "docs/spec.md, contracts/", run: "HH_PORT_BASE=8800
        ./run.sh start, then python3 -m unittest discover -s tests/e2e -t ."}}
      sleep {until: [{kind: "children"}, {kind: "message"}]}
      inventory asked whether a hold may outlive the departure; the spec says holds expire after
      15 minutes, so I answered its request:
      send_message {to: "inventory", kind: "reply", replyTo: "(the id of its request)", text:
        "Holds expire 15 minutes after they are made, whatever the departure."}
      All four came back done; acceptance reports 44 tests, 3 failing: logout (gateway), refunds
      on cancel (bookings or payments), payments down (bookings). I do not trace them myself:
      sub_mission {name: "integrate", template: "integrate", goal: "Make the whole system pass
        tests/e2e.", writeScope: ["services/"], params: {start: "HH_PORT_BASE=8800 ./run.sh
        start", check: "python3 -m unittest discover -s tests/e2e -t .", maxRounds: "2"}}
      While it works, the part where a mistake costs most is reviewed by someone who did not
      write it:
      sub_mission {name: "security", template: "review", goal: "Review services/gateway,
        services/accounts and how every service learns which user a request is for.", params:
        {criteria: "one user can never read or change another user's data; passwords are
        salted hashes; tokens expire and logout ends them; services trust the user only when
        the gateway passed it on"}}
      sleep {until: [{kind: "children"}]}
      integrate came back done (44 of 44; causes: a cached token, an event sent before its
      save, no timeout on payments). The review found that every service trusts the user
      header from any caller. That is platform's design, so it goes back to platform:
      run_subagents {tasks: [{name: "platform", agent: "lead", continues: "platform", goal: "The
        review found that every service trusts the user header from any caller. Have the
        gateway sign it with the secret of contracts/auth.md and every service check the
        signature; tell inventory and payments what to change by message.", writeScope:
        ["services/"]}]}
      sleep {until: [{kind: "children"}]}
      Then I check everything myself: ./run.sh stop and start (data kept); all acceptance tests
      (44 passed); all unit tests (63 passed); the acceptance tests with payments stopped
      (bookings still work, charges settle once it is back).
      reply {text: "The flight booking system is built: five services under services/, the
        shared interfaces in contracts/, ./run.sh to start and stop them. Checked: 44
        acceptance tests written from the spec by tasks that built nothing, and 63 unit tests,
        pass; data survives a restart; with payments down bookings still work. Fixed on the
        way: a token alive after logout, refunds lost on cancel, no timeout on payments, and
        services trusting the user header from any caller (found by a separate review)."}
