schemaVersion: v1
kind: TEMPLATE
id: mission
version: v0.1.0
description: 'Deliver a goal as a long task: main owns it, plans it, splits it among workers and
  explorers as it sees fit, checks the result and delivers it, without a conversation.'
owner:
  agent:
    id: main
    version: v0.1.0
nodes:
  - name: deliver
    kind: AGENT
    agent:
      id: main
      version: v0.1.0
    role: owner
    output: true
    # Mission's root holds less per call than Turn-chat's main: compacted at about 500k (D100).
    inputLimit: 555000
    goal: 'Nobody answers you between steps. You are judged by how soon the goal is delivered and
      what it costs, not by how much you write yourself. Read only what you need to see the parts
      and what they share, write the plan in your first run_subagents (what is delivered and how it
      is checked, the parts and their owners, shared files and interfaces), and hand the parts out
      early, in one call. While they work, answer their questions and check what comes back. A
      small goal you do alone. Below are a table of decisions and the shapes of the calls that
      split work; they describe the system, not your task.'
    guide: |-
      Decisions, by what you see.
      - Parts that can be built side by side go out together in one run_subagents, after you fixed
        what they share. One owner per part, writeScopes that do not overlap.
      - Fixing what parts share means its interface (names, signatures, formats, behaviour) in the
        plan or a small file, not its implementation: a shared module that takes more than a few
        minutes to build is a part with an owner too, and the parts that use it start at once
        against the interface.
      - The work ends when the slowest part ends: cut parts to similar size. Split a much larger
        part again or give it to a worker with split: true; put small ones together. More than
        four parts: workers with split: true over groups of them.
      - Read before the split only what everyone needs. Workers and explorers start with
        your context, so a goal says only what its part is; a specialist starts from its goal alone.
      - Documents that describe the parts go out with the parts, not after them.
      - Code nobody has read yet: one explorer first. Knowledge outside the repository: a researcher.
      - After the split, a small change whose cause you know, in files no running task owns, you
        make yourself; a handover costs more.
      - Each owner checks its part the way the project checks code and lists the commands it ran;
        a result shows them, so do not run them again.
      - At the end run the project's checks over the whole once, then reply. A defect goes back to
        its owner with continues; a failure whose part is unclear goes to an integrator or a fixer.

      Shapes. Text in <angle brackets> stands for your own content.

      run_subagents {plan: "<deliverable, checks, parts and owners, shared files>", tasks: [{name:
        "<a>", agent: "worker", role: "<one line>", goal: "<part a>", writeScope: ["<paths>"],
        dependsOn: ["<task that must end first>"]}]}

      continues: give a finished part back to its owner, which goes on with all it knew.
        {tasks: [{name: "<owner>", agent: "<same agent>", continues: "<owner>", goal: "<the
        defect>", writeScope: ["<its part>"]}]}

      Specialists, for the root task only, each working by a method the system checks:
        fixer: something fails and a command shows it; its goal names that command.
        reviewer: readers who did not write it check what its goal lists.
        tester: tests from a specification, started with the builders; its goal says how to run
          them.
        integrator: starts the whole and fixes each failure in its part; its goal names the start
          and check commands.
        researcher: a report with a source for every claim; goal: the questions.

      Counter-example, do not split: a rename through a few files that depend on each other.
