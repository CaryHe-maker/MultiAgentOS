schemaVersion: v1
kind: TEMPLATE
id: fix-verify
version: v0.1.0
description: 'Pre-orchestrated: find the cause of a failure, fix it, and check until it passes.'
origin: BUILTIN
nodes:
  - name: root
    kind: AGENT
    agent:
      id: lead
      version: v0.1.0
    output: true
playbook:
  summary: find the cause of a failure, fix it, and run a check until it passes
  params:
    - name: check
      description: the command that shows the failure now and must pass when it is fixed
      required: true
    - name: maxRounds
      description: how many fix rounds at most (1 to 3); 3 when absent
      required: false
  phases:
    - name: reproduce
      instructions: >-
        Run the check yourself first and read what fails; read the code it points to. Do not
        start a worker before you know what the failure is.
    - name: fix
      tasks:
        agent: worker
        min: 1
        max: 1
      repeat: 3
      instructions: >-
        Start one worker with your writeScope (or the part of it the fix needs). Its goal names
        the failure (the failing test, the error and where), the cause you found or suspect, what
        must not change, and its acceptance: the check passes. Sleep until it ends, then run the
        check yourself. If it still fails and rounds are left, start the next fix with what this
        round learned (what was tried, the new output); never repeat a fix that did not work.
    - name: report
      instructions: >-
        Finish with the cause, the change, the output of the last check and, when it still fails,
        what was tried and what you think is left.
  example: |-
    Example 1. Brief (from the root of a flight booking system): goal "test_cancel_refunds fails: a
    cancelled booking stays charged. bookings should send booking_cancelled
    (contracts/events.py) and payments refund on it; find which side breaks and fix it";
    check "python3 -m unittest tests.e2e.test_bookings -v"; maxRounds 2; writeScope
    ["services/bookings/", "services/payments/"].
    reproduce: I ran the check: test_cancel_refunds failed, the charge is still "settled" after
    the cancel. I read services/bookings/cancel.py: it publishes booking_cancelled to the outbox
    and then saves the cancel; services/payments/events.py refunds on booking_cancelled. The
    payments log shows no booking_cancelled at all, so the event is lost on the bookings side:
    the outbox is written before the cancel commits, and the publisher skips rows of bookings
    that are not yet cancelled.
    fix (round 1): run_subagents with one worker "outbox-order", writeScope
    ["services/bookings/"], goal "In services/bookings/cancel.py the event booking_cancelled is
    written to the outbox before the cancel is saved, and the publisher skips it. Save the
    cancel and the outbox row in one transaction, the cancel first; keep the event fields of
    contracts/events.py; do not change payments.", acceptance ["python3 -m unittest
    tests.e2e.test_bookings -v passes", "the unit tests of services/bookings pass"]. Slept
    until it ended. Check: 9 passed.
    report: finish_subagent status done; summary "bookings wrote booking_cancelled before the
    cancel was saved and the publisher skipped it; both are now saved in one transaction,
    cancel first; tests.e2e.test_bookings: 9 passed"; changed services/bookings/cancel.py.

    Example 2. Brief: goal "parse_date returns the wrong day for dates before 1970 since the
    switch to the new time library"; check "pytest tests/test_dates.py -q"; maxRounds 2;
    writeScope ["src/dates.py", "tests/test_dates.py"].
    reproduce: the check fails in test_before_epoch: 1969-12-31 comes back as 1970-01-01. In
    src/dates.py parse_date divides a negative number of seconds with // and then takes the
    remainder of the absolute value, so negative days round toward zero.
    fix (round 1): one worker "epoch-floor" with the cause and "keep the output for every date
    after 1970 as it is". Check: passed.
    report: finish_subagent status done: negative timestamps were rounded toward zero; fixed
    in src/dates.py; tests/test_dates.py passes.

    Example 3. Brief: goal "the build of the web app fails since the upgrade of the bundler";
    check "npm run build"; maxRounds 3; writeScope ["web/"].
    reproduce: the build stops at "Cannot use import statement outside a module" in
    web/scripts/icons.js, which the new bundler loads as CommonJS.
    fix (round 1): a worker renames it to icons.mjs and updates the import; the build now
    stops at a missing export in web/src/theme.ts. Round 2: a worker exports the theme as the
    error asks, with what round 1 learned; the build passes.
    report: finish_subagent status done with both causes, both changes and the last build
    output.
