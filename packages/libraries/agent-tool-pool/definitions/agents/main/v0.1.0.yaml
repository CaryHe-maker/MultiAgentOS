schemaVersion: v1
kind: AGENT
id: main
version: v0.1.0
description: 'The agent of a Turn-chat: reads, searches, changes and tests the repository and replies.'
role: coding assistant
modelRef:
  id: deepseek-flash
  version: v0.1.0
thinking:
  defaultEffort: high
  allowedEfforts:
    - none
    - low
    - high
    - max
promptRef:
  id: main-system
  version: v0.1.0
unitRefs:
  - id: repository-list
    version: v0.1.0
  - id: repository-search
    version: v0.1.0
  - id: file-read
    version: v0.1.0
  - id: file-write
    version: v0.1.0
  - id: file-edit
    version: v0.1.0
  - id: output-read
    version: v0.1.0
  - id: run-command
    version: v0.1.0
  - id: git-inspect
    version: v0.1.0
  - id: web-search
    version: v0.1.0
  - id: web-fetch
    version: v0.1.0
  - id: external-list
    version: v0.1.0
  - id: external-read
    version: v0.1.0
  - id: external-search
    version: v0.1.0
  - id: context-assemble
    version: v0.1.0
  - id: model-call
    version: v0.1.0
  - id: message-publish
    version: v0.1.0
startUnitRefs: []
actions:
  end:
    - toolRef:
        id: reply
        version: v0.1.0
      then: PUBLISH_REPLY
      allowedInFinal: true
  onDegraded: PUBLISH_NOTICE
  sleep:
    toolRef:
      id: sleep
      version: v0.1.0
  message:
    toolRef:
      id: send-message
      version: v0.1.0
  viewTasks:
    toolRef:
      id: view-tasks
      version: v0.1.0
  jobOutput:
    toolRef:
      id: job-output
      version: v0.1.0
  jobList:
    toolRef:
      id: job-list
      version: v0.1.0
  jobKill:
    toolRef:
      id: job-kill
      version: v0.1.0
  stop:
    toolRef:
      id: stop-subagents
      version: v0.1.0
  todos:
    toolRef:
      id: update-todos
      version: v0.1.0
  askUser:
    toolRef:
      id: ask-user
      version: v0.1.0
  spawn:
    toolRef:
      id: run-subagents
      version: v0.1.0
  subMission:
    toolRef:
      id: sub-mission
      version: v0.1.0
capabilities:
  - repo.read
  - workspace.write
  - command.exec
  - command.network
  - web.search
  - web.fetch
  - external.read
  - agent.spawn
limits:
  maxRounds: 80
  maxToolCallsPerRound: 8
  maxToolUnits: 200
budget:
  perCallInputLimit: 880000
  maxOutputTokens: 64000
  finalInputBudget: 880000
  finalMaxOutputTokens: 64000
