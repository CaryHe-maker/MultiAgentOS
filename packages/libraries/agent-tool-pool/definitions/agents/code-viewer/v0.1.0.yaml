schemaVersion: v1
kind: AGENT
id: code-viewer
version: v0.1.0
description: Reads the repository through orient, search and read units and writes the analysis report.
role: read-only code analyst
modelRef:
  id: deepseek-flash
  version: v0.1.0
thinking:
  defaultEffort: none
  allowedEfforts:
    - none
promptRef:
  id: code-viewer-system
  version: v0.1.0
unitRefs:
  - id: repository-orient
    version: v0.1.0
  - id: repository-search
    version: v0.1.0
  - id: file-read
    version: v0.1.0
  - id: context-assemble
    version: v0.1.0
  - id: model-call
    version: v0.1.0
  - id: report-publish
    version: v0.1.0
startUnitRefs:
  - id: repository-orient
    version: v0.1.0
actions:
  end:
    - toolRef:
        id: finish-analysis
        version: v0.1.0
      then: PUBLISH_REPORT
      allowedInFinal: true
  onDegraded: PUBLISH_REPORT
capabilities:
  - repo.read
limits:
  maxRounds: 20
  maxToolCallsPerRound: 8
  maxToolUnits: 200
budget:
  perCallInputLimit: 880000
  maxOutputTokens: 64000
  finalInputBudget: 880000
  finalMaxOutputTokens: 64000
