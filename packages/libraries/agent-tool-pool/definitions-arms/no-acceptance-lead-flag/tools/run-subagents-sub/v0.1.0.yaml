schemaVersion: v1
kind: TOOL
id: run-subagents-sub
version: v0.1.0
description: Control tool that starts SubAgent tasks, offered below the root where only workers and explorers start (D88).
purpose: CONTROL
modelName: run_subagents
modelDescription: >-
  Start up to 8 subtasks that run in parallel. Returns at once; each result comes to you
  when its task ends (sleep with until children to wait). Each task has a unique name, an agent
  (explorer, worker, or for the root task the specialists fixer, reviewer, tester, integrator,
  researcher), a goal, and optionally role (one line every task sees), dependsOn (names of tasks of
  this call it waits for and whose results it gets), inputs (artifacts you hand over), effort and
  budget. A task finishes when its goal is done, so the goal says what done means. A worker or specialist needs writeScope: the
  repository paths it may change, inside what you may write and not overlapping a task that can run
  at the same time; until it ends only it writes there and your commands see it read-only. An
  explorer has no writeScope. A worker or explorer starts with your context, so its goal says
  only what its part is; a specialist starts from its goal alone. continues starts a task from the
  history of an ended task of yours (same agent): use it to send a defect back to its owner. plan
  (what is delivered, how it is checked, the parts and owners, shared files) must come with the root
  task's first call; every task sees it. A task that breaks a rule is not started and you are told
  why; the others start. A result shows the summary, the report when short, and the checks the task
  ran; read a long report or a handed-over result with read_output by its ref_N/toolCallId. You
  cannot reply or finish while a task you started runs.
parametersContract:
  kind: contract
  id: workflow.RunSubagentsLeanNoLeadArgs
  version: v1
riskClass: MEDIUM
sideEffect: WORKSPACE_WRITE
isIdempotent: false
contentStatus: FINAL
