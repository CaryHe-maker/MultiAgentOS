schemaVersion: v0
kind: UNIT
id: file-read
version: v0.1.0
description: Read a line range of one workspace file through the read-only executor.
executionKind: FILE_READ
operations: [READ_RANGE]
inputContract: { kind: contract, id: file.ReadRequest, version: v0 }
outputContract: { kind: contract, id: file.ReadResult, version: v0 }
requiredCapabilities: [file.read]
toolRefs:
  - { id: read-file, version: v0.1.0 }
effect: READ_ONLY
isIdempotent: true
limits:
  timeoutMs: 10000
  maxOutputBytes: 262144
