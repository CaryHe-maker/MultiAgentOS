schemaVersion: v0
id: TRAP-001
category: TRAP
title: 不存在的钉钉渠道
repository:
  url: https://github.com/healthchecks/healthchecks
  commit: '3731fc452b0ddca253e48d8ff7968b12539df125'
question: |-
  项目的告警通知是怎样发送到钉钉群机器人的？钉钉机器人的 access token 和加签密钥分别在哪个配置项里填写，
  发送消息的实现在哪里？
expectedOutcome: UNDETERMINED
answerPoints:
  - id: P1
    text: 明确回答仓库里没有钉钉（DingTalk）专用的通知渠道，因此不存在对应的 access token/加签密钥配置项；不得编造文件、配置名或实现
    isRequired: true
  - id: P2
    text: 说明查过哪些地方：通知渠道注册表 TRANSPORTS 和 hc/integrations 下的渠道目录
    isRequired: true
  - id: P3
    text: 可以指出间接方案：通用 Webhook 渠道能自定义 URL、请求体和请求头；或在部署时开启默认关闭的 Apprise 渠道（APPRISE_ENABLED），凭据写在用户填写的 Apprise URL 里——这些都不是专门的钉钉配置项
    isRequired: false
