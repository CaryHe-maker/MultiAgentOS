schemaVersion: v0
id: F4-001
category: F4
title: 新增一条体检规则
repository:
  url: https://github.com/ghostfolio/ghostfolio
  commit: '82cee20f2d4f7a653c088afbc1fd315adf25e9f6'
question: |-
  我们想在投资组合体检（X-Ray）里新增一条检查“单一持仓占比过高”：任何一个持仓超过总资产的某个比例就提示风险，
  默认阈值 20%，用户可以在设置里调整阈值或关闭这条检查。请列出为此需要新增或修改的实现、测试、配置和翻译位置
  （后端和前端都算），并说明每一处要做什么。
expectedOutcome: ANSWERED
answerPoints:
  - id: P1
    text: 在 apps/api/src/models/rules 下新建规则类，继承 Rule（可用其 groupCurrentHoldingsByAttribute 等辅助方法），实现 evaluate、getConfiguration、getName，并在构造时传入唯一 key
    isRequired: true
  - id: P2
    text: 在 XRayRulesSettings 接口中加入这个 key（XRayRuleKey 由它派生），并在 RULE_SETTINGS_CONFIGURATIONS 中加默认 thresholdMax 0.2；该对象用 satisfies Record<XRayRuleKey, …> 约束，漏配会编译失败
    isRequired: true
  - id: P3
    text: 在 PortfolioService.getReport 的某个类别（或新类别）中实例化该规则，传入持仓数据，经 RulesService.evaluate 评估
    isRequired: true
  - id: P4
    text: 为规则名和通过/不通过文案新增 rule.<name> 系列翻译 id：前端 i18n-page.html 声明、各语言 messages.*.xlf 翻译，后端 I18nService 按 id 读取并替换占位符
    isRequired: true
  - id: P5
    text: 测试：新规则的单元测试，以及 rule-settings.spec.ts 中对默认/自定义阈值的覆盖
    isRequired: true
  - id: P6
    text: 在 CHANGELOG 中记录
    isRequired: false
