# The quality gate of docs/Style.md 6.3 and the compatibility matrix, on the
# acceptance platform (Ubuntu 24.04 LTS). It needs no secrets, calls no model and uses no
# network beyond installing dependencies.
name: quality-gate

on:
  push:
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The main cell: Node.js from .node-version (the lower bound of `engines`) with rg.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # ExecutorSet 3.3 checks that rg and the built-in scan agree; without rg those tests skip.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: git diff --check

  # The frozen system tests of docs/M2/M2FrozenTests.md with a working sandbox: any of them that
  # fails or is skipped fails the job. Ubuntu 24.04 restricts unprivileged user namespaces, so
  # bubblewrap gets the AppArmor profile that sandbox-probe.yml measured.
  phase-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap
      - name: Let bubblewrap create user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      # The sandbox cases for tools under the home directory (M2Design 6.1) only run when Node is
      # there, as it is with nvm on a developer machine; the runner keeps it in /opt, so a copy
      # goes under $HOME and first on the PATH. Skipped tests fail this job.
      - name: Put Node under the home directory
        run: |
          cp -r "$(dirname "$(dirname "$(command -v node)")")" "$HOME/node-home"
          echo "$HOME/node-home/bin" >> "$GITHUB_PATH"
      - run: node -p "process.execPath"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/phase-gate.mjs

  # The other cells of the matrix run the whole offline chain under one changed condition each.
  compatibility:
    name: compatibility (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: node-24-latest
            node: '24.x'
            ripgrep: present
          - cell: without-rg
            # Empty: the Node.js of .node-version, as in the main cell.
            node: ''
            ripgrep: absent
    env:
      MULTIAGENTOS_RIPGREP: ${{ matrix.ripgrep }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Exactly one of the two inputs is set, so setup-node has nothing to override.
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node == '' && '.node-version' || '' }}
          cache: pnpm
      - run: node --version
      - if: matrix.ripgrep == 'present'
        run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version
      - if: matrix.ripgrep == 'absent'
        run: |
          if command -v rg; then sudo apt-get remove -y ripgrep; fi
          ! command -v rg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
