# The quality gate of docs/Style.md 6.3 and the compatibility matrix of M1TechStack 11, on the
# acceptance platform (Ubuntu 24.04 LTS). It needs no secrets, calls no model and uses no
# network beyond installing dependencies.
name: quality-gate

on:
  push:
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The main cell: Node.js from .node-version (the lower bound of `engines`) with rg.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # ExecutorSet 3.3 checks that rg and the built-in scan agree; without rg those tests skip.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: git diff --check
      - run: pnpm run demo:fake

  # The other cells of the matrix run the whole offline chain under one changed condition each.
  compatibility:
    name: compatibility (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: node-24-latest
            node: '24.x'
            ripgrep: present
          - cell: without-rg
            # Empty: the Node.js of .node-version, as in the main cell.
            node: ''
            ripgrep: absent
    env:
      MULTIAGENTOS_RIPGREP: ${{ matrix.ripgrep }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Exactly one of the two inputs is set, so setup-node has nothing to override.
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node == '' && '.node-version' || '' }}
          cache: pnpm
      - run: node --version
      - if: matrix.ripgrep == 'present'
        run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version
      - if: matrix.ripgrep == 'absent'
        run: |
          if command -v rg; then sudo apt-get remove -y ripgrep; fi
          ! command -v rg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run demo:fake
