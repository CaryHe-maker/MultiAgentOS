# The quality gate of docs/Style.md 6.3 on the acceptance platform (Ubuntu LTS). It needs no
# secrets, calls no model and uses no network beyond installing dependencies.
name: quality-gate

on:
  push:
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: git diff --check
      - run: pnpm run demo:fake
